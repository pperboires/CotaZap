<div class="supplier-list-container">
    <div class="header">
        <h2>Fornecedores</h2>
        <a routerLink="/suppliers/new" class="btn-primary">Novo Fornecedor</a>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Contato</th>
                    <th>Whatsapp</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                @for (supplier of suppliers(); track supplier.id) {
                <tr>
                    <td>{{ supplier.name }}</td>
                    <td>{{ supplier.contactName || '-' }}</td>
                    <td>{{ supplier.whatsapp }}</td>
                    <td class="actions">
                        <button (click)="editSupplier(supplier.id)" class="btn-edit">Editar</button>
                        <button (click)="deleteSupplier(supplier.id)" class="btn-delete">Excluir</button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="4" class="empty-state">Nenhum fornecedor cadastrado.</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
