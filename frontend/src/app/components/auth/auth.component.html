<div class="auth-container">
    <div class="auth-card">
        <div class="logo" (click)="goHome()">Cota<span>Zap</span></div>

        <h2>{{ isLogin ? 'Bem-vindo de volta' : 'Crie sua conta' }}</h2>
        <p class="subtitle">{{ isLogin ? 'Entre com suas credenciais para continuar' : 'Comece a automatizar suas
            cotações hoje' }}</p>

        <div class="social-auth">
            <button class="btn-social" (click)="loginWithGoogle()">
                <img src="https://lh3.googleusercontent.com/COxitqS2nrnZrtp61S-ID8qn1i3gtTb5oK19vBnTXh5DBy0B9Sq9fO7G6f6Gfs4G93_8"
                    alt="Google">
                {{ isLogin ? 'Entrar com Google' : 'Cadastrar com Google' }}
            </button>
        </div>

        <div class="divider">
            <span>ou use seu e-mail</span>
        </div>

        <form (submit)="onSubmit($event)">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" [(ngModel)]="email" name="password" placeholder="••••••••"
                    required>
            </div>

            <button type="submit" class="btn-primary btn-block">
                {{ isLogin ? 'Entrar' : 'Criar Conta' }}
            </button>
        </form>

        <p class="footer-text">
            {{ isLogin ? 'Ainda não tem conta?' : 'Já tem uma conta?' }}
            <a (click)="toggleMode()">{{ isLogin ? 'Cadastre-se' : 'Faça login' }}</a>
        </p>
    </div>
</div>
